# Linux environment for local runs and CI (Playwright jammy image) — stable visual baselines.
services:
  bookstore:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run server"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://127.0.0.1:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    working_dir: /app
    depends_on:
      bookstore:
        condition: service_healthy
    environment:
      CI: 'true'
      BASE_URL: http://bookstore:3000
      API_URL: http://bookstore:3000
      PLAYWRIGHT_EXTERNAL_SERVER: 'true'
    volumes:
      - .:/app
    profiles:
      - tests
