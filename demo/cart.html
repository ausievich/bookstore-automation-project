<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cart — Online Bookstore</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Shopping Cart</h1>
    <nav>
      <a href="catalog.html" data-testid="nav-catalog">Catalog</a>
      <a href="cart.html" data-testid="nav-cart">Cart (<span data-testid="cart-counter">0</span>)</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <p class="hidden" data-testid="empty-cart-message">Your cart is empty.</p>
      <ul class="book-list" data-testid="cart-items"></ul>
      <p><strong data-testid="cart-subtotal">Subtotal: $0.00</strong></p>
      <a href="checkout.html" data-testid="checkout-link"><button type="button">Proceed to checkout</button></a>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    BookstoreApp.requireAuth();

    async function loadCart() {
      const data = await BookstoreApp.api('/api/cart');
      const list = document.querySelector('[data-testid="cart-items"]');
      const empty = document.querySelector('[data-testid="empty-cart-message"]');
      const subtotal = document.querySelector('[data-testid="cart-subtotal"]');
      list.innerHTML = '';

      if (!data.items.length) {
        empty.classList.remove('hidden');
        subtotal.textContent = 'Subtotal: $0.00';
        return;
      }
      empty.classList.add('hidden');
      subtotal.textContent = `Subtotal: $${data.subtotal.toFixed(2)}`;

      data.items.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.testid = `cart-item-${item.bookId}`;
        li.innerHTML = `
          <span>${item.title} × <input type="number" min="1" value="${item.quantity}" data-testid="qty-${item.bookId}" style="width:4rem" /></span>
          <span>
            $${item.lineTotal.toFixed(2)}
            <button type="button" data-testid="remove-${item.bookId}" class="secondary">Remove</button>
          </span>
        `;
        li.querySelector(`[data-testid="qty-${item.bookId}"]`).addEventListener('change', async (e) => {
          const qty = Number(e.target.value);
          await BookstoreApp.api(`/api/cart/items/${item.bookId}`, {
            method: 'PATCH',
            body: JSON.stringify({ quantity: qty }),
          });
          await loadCart();
          await BookstoreApp.refreshCartCounter();
        });
        li.querySelector(`[data-testid="remove-${item.bookId}"]`).addEventListener('click', async () => {
          await BookstoreApp.api(`/api/cart/items/${item.bookId}`, { method: 'DELETE' });
          await loadCart();
          await BookstoreApp.refreshCartCounter();
        });
        list.appendChild(li);
      });
    }

    BookstoreApp.refreshCartCounter();
    loadCart();
  </script>
</body>
</html>
