name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-node-project

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Playwright Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup project with Playwright
        uses: ./.github/actions/setup-node-project
        with:
          install-playwright: 'true'

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'cancelled'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup project
        uses: ./.github/actions/setup-node-project

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate Allure report
        run: npm run allure:generate
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Patch report for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/allure-pages-patch.mjs

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload report artifact for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure Report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Allure Report link
        if: always()
        run: |
          REPORT_URL="https://ausievich.github.io/bookstore-automation-project/"
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            REPORT_URL="${{ steps.deployment.outputs.page_url }}"
          fi
          {
            echo "## Allure Report"
            echo "[${REPORT_URL}](${REPORT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
